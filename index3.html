<!DOCTYPE html>
<html lang="fr">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Taym Academy</title>

    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <div class="page">

        <div class="formulaire">

            <h1>REGISTER</h1>

                </button>

            </form>

        </div>

    </div>
