<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign-In - Taym Academy</title>

    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="page">

        <!-- Image de l'icône -->
        <div class="icone">
            <img src="tete.png" alt="Icône utilisateur">
        </div>

        <!-- Titre -->
        <h1>SIGN-<span>IN</span></h1>


        <!-- Formulaire -->
        <form>

            <label>Name :</label>
            <input type="text" placeholder="Enter your name">


            <label>Password :</label>
            <input type="password" placeholder="Enter your password">


            <button type="submit">
                SUBMIT →
            </button>

        </form>

    </div>

</body>
</html>
